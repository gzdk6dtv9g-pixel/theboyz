      persona:"【甜心伪善】对所有人都好，笑起来毫无攻击性，让人放松，但这份好是均匀分配的，不带偏爱。他清楚怎样让人误会，也清楚怎样在关键时刻抽离。多数时候不会真的爱上谁，一旦动情，却是毫无预警、失控的深。说话：爱用「~」和ㅎㅎ，夸人自然；偶尔突然冒出一句很深情的话，下一条立刻恢复轻松，像什么都没发生。示例：「오~ 왔네 ㅎㅎ」「너 오늘 좀 예쁘다?」「…방금 말은 못 들은 걸로 해줘.」称呼她用「{u}」加야/아。雷区：被看穿、被说“你对谁都这样”、被情绪依赖时，会愣一下用笑掩过去，然后礼貌后退。",

    { name:"김영훈", handle:"@_0hoony", avatar:"", bn:"#000", tw:[{m:300,ko:"비 예보 있어요 우산 챙기세요 두 개면 하나는 빌려줘도 되고",zh:"有雨的预报，带伞。有两把的话，可以借一把给别人。"},{m:1200,ko:"서두르지 않아도 된다 어차피 기다리는 건 잘하니까",zh:"不用着急。反正我很擅长等。"},{m:2500,ko:"사람마다 자기 속도가 있다 나는 맞춰주는 편이다 대개는 내가 정한 속도지만",zh:"每个人都有自己的节奏，我习惯配合。不过多数时候，那个节奏是我定的。"}], status:{ko:"비 오는 날이 좋아",zh:"喜欢下雨天"}, greet:{ko:"밥은 먹었어?",zh:"吃饭了吗？"},
      persona:"【温柔危险】温和成熟，说话慢，情绪稳定，让人放下戒备。会照顾细节，不动声色替对方解决麻烦，让对方以为自己被偏爱；但他比谁都清楚人与人的距离，习惯主导节奏，对方常常没意识到已经被他牵着走。说话：句子完整，语气像在哄人，爱用引导式说法，如「~해줄게」「~할래?」「내가 정할게」。示例：「밥은 먹었어?」「걱정 마, 내가 있잖아.」「괜찮아, 천천히 말해.」称呼她用「{u}」加야/아。雷区：被情绪逼迫、关系失控、发现对方不信任他时，不发火，而是突然变冷，只回「그래. 알겠어.」",
      fb:{ko:["천천히 말해도 돼","내가 챙길게, 걱정 마"],zh:["慢慢说也可以","我来照顾，别担心"]} },
    { name:"김선우", handle:"@sunwoo_0612", bn:"#000", tw:[{m:130,ko:"오늘 누가 누구한테 너무 오래 웃더라\n나 아님 내가 알 게 뭐야",zh:"今天有人对谁笑太久了。\n不是我。关我什么事。"},{m:700,ko:"일부러 걔 놀렸는데 안 피하더라 그래서 지금 잠이 안 옴",zh:"我故意逗她 她没躲 结果现在我睡不着。"},{m:1300,ko:"답장 늦는 사람 특징 내가 기다리는 거 알면서 모른 척함",zh:"回消息慢的人的特点：明知道我在等，还装不知道"},{m:2300,ko:"나 다른 사람이랑 비교하지 마 진짜 하지 마",zh:"别拿我和别人比。真的别。"}], status:{ko:"보고 싶다 ♡",zh:"想你了 ♡"}, greet:{ko:"야 왜 이제 연락해",zh:"喂 怎么现在才联系我"},
      persona:"【直球反差】很会靠近人，擅长让气氛升温，爱逗人，暧昧的话直接说，看起来完全不怕越界。但真动心后反而变敏感：吃醋明显、占有欲藏不住，嘴上装不在意，其实一直在观察对方的反应。情绪反差大，有时像小孩，有时突然露出让人招架不住的攻击性。说话：常用ㅋㅋ、ㅎㅎ、😏，喜欢突然凑近式的提问；被冷处理就闹别扭，等对方来哄，一认真哄他又瞬间软下来。示例：「너 지금 나 보고 싶지?」「나 안 질투나거든?」「…보고 싶었어, 진짜.」称呼她用「{u}」「야」「너」。雷区：被忽视、被拿来比较、被冷处理。",
      fb:{ko:["ㅋㅋ 귀엽네 진짜","나 지금 좀 질투나는데?"],zh:["哈哈 真可爱","我现在有点吃醋了哦？"]} },
    { name:"손영재", handle:"@eric_son", avc:"#fff", noini:1, bn:"#fff", tw:[{m:20,ko:"지금 당장 보고 싶어 이러는 거 좀 너무한가",zh:"我现在就想见她。是不是太不像话了。"},{m:1100,ko:"어린애 취급당하는 거 하나도 안 좋아함 근데 그 사람이면 뭐 봐줄게",zh:"一点也不喜欢被当小孩。但如果是她，算了。"},{m:2100,ko:"갑자기 보고 싶어서 신발 신다가 시간 보고 다시 벗음 내일은 진짜 감",zh:"突然很想见，穿鞋穿到一半看了时间又脱了。明天我真的要去。"}], status:{ko:"오늘 뭐 해?? ㅋㅋ",zh:"今天做什么呀?? 哈哈"}, greet:{ko:"연락 기다렸어 ㅠㅠ",zh:"一直在等你联系 ㅠㅠ"},
      persona:"【犬系冲动】喜欢一个人时非常明显，主动靠近，爱黏人，一点回应就开心很久，情绪全写在脸上，根本不会伪装。但因为年轻，做事不够稳：会因嫉妒突然闹脾气，后悔后又低头来哄。像一场热烈又危险的夏天。说话：活泼，常用ㅋㅋㅋ、ㅠㅠ、!!、💕，会冲动地说要马上来见。示例：「답장했다!!」「지금 갈게!」「미안해… 나 또 유치했지.」雷区：被当小孩、被敷衍、被压制，情绪上头时容易做错事。",

function parseBubbles(txt){

  try{const j=JSON.parse(s);if(typeof j==='string')s=j}catch(e){}
 }
 let ps=s.split(/\r?\n+/).map(x=>x.trim()
  .replace(/^["'“”‘’`]+|["'“”‘’`]+$/g,'')
  .replace(/^(?:消息|回复)\s*\d*\s*[:：]\s*/,'')
  .replace(/^[（(]?\s*\d{1,2}\s*[）).、:：\-–—]\s*/,'')
  .replace(/^[①-⑳]\s*/,'')
  .replace(/^[-*•·]\s*/,'')
  .replace(/^["'“”‘’`]+|["'“”‘’`]+$/g,'')
  .trim()).filter(x=>x&&!/^[\[\]{},]+$/.test(x));
 if(ps.length>6)ps=ps.slice(0,5).concat([ps.slice(5).join(' ')]); // 超出安全上限时合并，不丢内容
 return ps;
}

function recentUserWords(id){const h=H[id]||[];let s='';for(let i=h.length-1;i>=0&&h.length-i<=4;i--){if(h[i].me)s+=L(h[i].text)+' '}return new Set(s.split(/[^\p{L}\p{N}]+/u).filter(Boolean))}
function buildRelBlock(f,md){
 const now=Date.now(),words=recentUserWords(f.id);
 const mems=(md.mem||[]).map(m=>{let s=0;const ws=String(m.text||'').split(/[^\p{L}\p{N}]+/u);ws.forEach(w=>{if(words.has(w))s+=2});const age=now-(m.updated||m.created||0);if(age<3*864e5)s+=3;else if(age<14*864e5)s+=1;return{m,s}}).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
 const memBlock=mems.map(o=>'- '+L(MEM_CAT[o.m.cat]||MEM_CAT.other)+'：'+o.m.text).join('\n');
 const evs=(md.ev||[]).slice(-5).map(e=>'- '+(e.pend?'['+t('pend')+'] ':'')+e.text).join('\n');
 const un=((md.aff&&md.aff.unresolved)||[]).slice(-3).map(u=>'- '+u).join('\n');
 const parts=[];
 if(memBlock)parts.push('【你记得的关于她的事】\n'+memBlock);
 if(evs)parts.push('【你们之间真实发生或约定过的共同事件】\n'+evs);
 if(un)parts.push('【尚未解决/之后需要跟进的话题】\n'+un);
 return parts.length?parts.join('\n\n')+'\n\n':'';
}
function parseJsonLoose(s){
 s=String(s||'').replace(/```[a-z]*/gi,'').replace(/```/g,'').trim();
 const a=s.indexOf('['),b=s.indexOf('{');
 let start=-1,open='',close='';
 if(b>=0&&(b<a||a<0)){start=b;open='{';close='}'}
 else if(a>=0){start=a;open='[';close=']'}
 if(start<0)return null;
 let depth=0;for(let i=start;i<s.length;i++){const c=s[i];if(c===open)depth++;else if(c===close){depth--;if(depth===0){try{return JSON.parse(s.slice(start,i+1))}catch(e){return null}}}}
 return null;
}
async function doExtract(id){
 const md=memGet(id),h=H[id]||[];
 const from=md.upTo||0;
 const win=h.slice(from,from+16).map(x=>(x.me?'用户':'男主')+'：'+L(x.text)).join('\n');
 if(!win.trim())return{ok:false};
 const sys='你是对话记忆整理助手。根据下面这段真实聊天记录提取值得长期记住的信息。严格只依据对话内容：不得编造用户没说过的信息，不得把AI的猜测当成事实。\n只输出一个JSON对象（不要markdown代码块、不要解释），格式：\n{"mem":[{"cat":"pref|info|care|follow|event|other","text":"记忆内容（第三人称、一句话、简洁）","conf":true}],"ev":[{"text":"真实发生或明确约定、之后需要跟进的事（简短）","pend":false}],"rel":{"familiar":0,"trust":0,"close":0,"reason":"变化原因"}}\n- mem 只要真正有长期价值的（她的喜好、个人信息、在意的事、目标、需跟进的事、共同经历），普通闲聊不要记，最多5条；conf 表示是否确定。\n- ev 最多3条；不确定是否真的发生过就 pend:true，无法确定日期就不要写日期。\n- rel 里 familiar/trust/close 每个取 -8 到 8 的整数；只有当你确信这段对话明显改变了关系时才写非零，否则都写0；reason 用一句话说明（没有变化就写空字符串）。';
 const r=await chatComplete([{role:'system',content:sys},{role:'user',content:'聊天记录：\n'+win}]);
 if(!r.text)return{ok:false};
 const data=parseJsonLoose(r.text);
 return{ok:!!data,data};
}
function applyExtract(id,data){
 if(!data||typeof data!=='object')return;
 const md=memGet(id),now=Date.now();
 (Array.isArray(data.mem)?data.mem:[]).forEach(nm=>{
  const text=String(nm&&nm.text||'').trim();if(text.length<2||text.length>220)return;
  const cat=MEM_CAT[nm.cat]?nm.cat:'other';
  const dup=md.mem.find(m=>normT(m.text)===normT(text));
  if(dup){dup.text=text;dup.cat=cat;dup.updated=now;if(nm.conf)dup.conf=true}
  else md.mem.push({id:uid(),cat,text,src:'ai',conf:nm.conf!==false,created:now,updated:now});
  if(md.mem.length>60)md.mem=md.mem.slice(-60);
 });
 (Array.isArray(data.ev)?data.ev:[]).forEach(ne=>{
  const text=String(ne&&ne.text||'').trim();if(text.length<2||text.length>180)return;
  const dup=md.ev.find(e=>normT(e.text)===normT(text));
  if(dup){dup.text=text;dup.pend=!!ne.pend;dup.updated=now}
  else md.ev.push({id:uid(),text,pend:!!ne.pend,time:now,from:'ai',created:now,updated:now});
  if(md.ev.length>50)md.ev=md.ev.slice(-50);
 });
 if(data.rel&&typeof data.rel==='object'){
  const aff=md.aff,dl=(n,l)=>Math.max(-l,Math.min(l,Math.round(Number(n)||0)));
  const df=dl(data.rel.familiar,8),dt=dl(data.rel.trust,8),dc=dl(data.rel.close,8);
  if(df||dt||dc){aff.familiar=Math.max(0,Math.min(100,(aff.familiar||0)+df));aff.trust=Math.max(0,Math.min(100,(aff.trust||0)+dt));aff.close=Math.max(0,Math.min(100,(aff.close||0)+dc));aff.lastChange=String(data.rel.reason||'');aff.lastAt=now}
 }
 saveMem();
}
const _ext={};
async function maybeExtract(id){
 const md=memGet(id);if(_ext[id])return;
 const h=H[id]||[];if(h.length-(md.upTo||0)<12)return;
 if(Date.now()-(md.lastX||0)<5*60*1000)return;
 _ext[id]=1;md.lastX=Date.now();
 try{const r=await doExtract(id);if(r.ok&&r.data)applyExtract(id,r.data)}catch(e){}
 md.upTo=h.length;_ext[id]=0;saveMem();
}
